name: Rust and JVM compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# No debug info: test binaries link faster and the build cache stays small.
# Incremental artifacts are useless on a fresh runner. Opt-level 1 for the
# workspace crates: the replay tests are bound by unoptimized server code
# (measured 3.5-4x faster). Overflow checks and debug assertions are separate
# settings and stay on.
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_OPT_LEVEL: '1'

# Two jobs run side by side: formatting, lints and the Rust tests in one, the
# JVM oracles and interop checks in the other. Neither reads what the other
# writes (the tests ran before every oracle when they were one job).
jobs:
  tests:
    name: Rust formatting, lints and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.0
          rustup target add wasm32-unknown-unknown
      # Caches ~/.cargo and the compiled dependencies in target/; the
      # workspace crates are rebuilt every run. The key includes the
      # toolchain and Cargo.lock.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Verify pinned Macroquad atlas texture lifetime patch
        run: python tools/check_macroquad_vendor.py
      - name: Lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Some tests read the pinned original sources, so fetch them first.
      - name: Fetch locked original sources
        run: cargo xtask bootstrap
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # nextest runs the test binaries in parallel (cargo test runs them one at
      # a time). It does not run doc tests; the workspace has none (its doc
      # code blocks are all `text`). Add `cargo test --doc` if one appears.
      - name: Rust regression and differential tests
        run: cargo nextest run --locked --workspace
      # The controlled sessions' tests live in examples, which the workspace
      # run does not include. (They ran in the oracle job before; this job
      # has the server built already.)
      - name: Verify walk/run/rebuild packets reach the shared player consumer
        run: cargo test --locked -p rs09-server --example movement_session
      - name: Verify controlled NPC/player stream composition
        run: cargo test --locked -p rs09-server --example npc_session
      - name: Browser protocol and visual build checks
        run: cargo check --locked --target wasm32-unknown-unknown -p rs09-protocol -p rs09-client -p rs09-audio-worklet

  oracles:
    name: JVM oracles and interop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # rustfmt: several tools/port_*.py checks format the code they generate.
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt
          rustup default 1.97.0
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Fetch locked original sources
        run: cargo xtask bootstrap
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original Kotlin compiler's JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      # Oracles that compile the original Kotlin read RS09_ORACLE_JAVA_HOME and
      # use JDK 11. The rest use the default JDK, and some need APIs newer than 11.
      - name: Keep JDK 25 as the default and point the Kotlin oracles at JDK 11
        run: |
          "RS09_ORACLE_JAVA_HOME=$env:JAVA_HOME_11_X64" >> $env:GITHUB_ENV
          "JAVA_HOME=$env:JAVA_HOME_25_X64" >> $env:GITHUB_ENV
          "$env:JAVA_HOME_25_X64\bin" >> $env:GITHUB_PATH
      # Pinned downloads. The oracles check each file's size and SHA-256 before
      # using it and download it again if it differs, so a cache cannot change
      # what runs; it only skips the download (and its outages).
      - name: Cache the pinned Kotlin compiler
        uses: actions/cache@v4
        with:
          path: runs/kotlin-1.8.20
          key: kotlin-${{ hashFiles('oracle/login/kotlin.lock.json') }}
      - name: Cache the pinned MariaDB and SQL drivers
        uses: actions/cache@v4
        with:
          path: |
            runs/sql-tools/*.zip
            runs/sql-tools/*.jar
          key: sql-tools-${{ hashFiles('oracle/sql/artifacts.lock.json') }}
      - name: Fetch and verify complete pinned cache
        if: github.event_name == 'workflow_dispatch'
        run: cargo xtask cache-fetch
      # Every oracle check in oracle/ci.toml, four at a time (the runner has
      # four cores). An entry waits for each earlier entry that shares one of
      # its runs/ folders, so the outcome matches running them in order.
      # Each check's output is a collapsed group in the log; failures are
      # listed at the end.
      - name: Reproduce original JVM outputs, fixtures and interop (oracle/ci.toml)
        run: cargo xtask oracles --check --jobs 4
      - name: Compare all cache files with original JVM
        if: github.event_name == 'workflow_dispatch'
        run: cargo run --release -p xtask -- cache-audit --jvm
      - name: Connect original JVM cache client to Rust server
        if: github.event_name == 'workflow_dispatch'
        run: cargo xtask network-interop
      - name: Build native headless cache probe
        if: github.event_name == 'workflow_dispatch'
        run: cargo build --locked -p rs09-headless
      - name: Exercise 500 TCP and 500 WebSocket cache connections
        if: github.event_name == 'workflow_dispatch'
        run: cargo xtask network-smoke
      - name: Compare complete pinned server NPC metadata with original JVM
        if: github.event_name == 'workflow_dispatch'
        run: cargo run --release -p xtask -- npc-definition-audit
      - name: Compare every pinned server animation definition with the original JVM
        if: github.event_name == 'workflow_dispatch'
        run: cargo run --release -p xtask -- animator-audit
      - name: Compare real pinned Lumbridge door scene with original JVM
        if: github.event_name == 'workflow_dispatch'
        run: cargo run --release -p xtask -- scene-audit
      - name: Compare all pinned server scenery definitions with original JVM
        if: github.event_name == 'workflow_dispatch'
        run: cargo run --release -p xtask -- scenery-definition-audit
      - name: Compare all pinned item definitions with original JVM methods
        if: github.event_name == 'workflow_dispatch'
        run: cargo run --release -p xtask -- item-audit
      - name: Compare complete pinned item configuration over native cache definitions
        if: github.event_name == 'workflow_dispatch'
        run: cargo run --release -p xtask -- item-config-audit
