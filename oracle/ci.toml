# The oracle checks CI runs on every push and pull request, in this order.
#
# `cargo xtask oracles --check` (tools/run_oracles.py) runs them in parallel.
# An entry waits for every earlier entry that touches one of the same runs/
# folders (its own, the ones its generator names, and those of the
# generators it imports, which usually re-run their compile there), so the
# result is the same as running them one at a time in this order. An entry
# whose folders cannot be worked out waits for everything before it, and
# everything after waits for it; `exclusive = true` forces that.
#
#   name      the label printed in the CI log
#   xtask     the arguments of `cargo xtask`
#   tools     scripts run as `python <tool> --check` after the xtask command
#
# Checks that need the complete pinned cache stay as manual-only steps in
# .github/workflows/compatibility.yml.

[[check]]
name = "Reproduce original JVM outputs and source hashes"
xtask = ["oracle", "--check"]

[[check]]
name = "Reproduce original cache reader and extraction fixtures"
xtask = ["cache-oracle", "--check"]

[[check]]
