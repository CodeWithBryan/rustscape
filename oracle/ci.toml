xtask = ["headless-lifecycle-oracle", "--check"]

[[check]]
name = "Reproduce original Java and Kotlin login cases"
xtask = ["login-oracle", "--check"]
# Downloads the pinned Kotlin compiler every later Kotlin oracle uses.
exclusive = true

