name: Rust and JVM compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.0
          rustup target add wasm32-unknown-unknown
      - name: Formatting
        run: cargo fmt --check
      - name: Verify pinned Macroquad atlas texture lifetime patch
        run: python tools/check_macroquad_vendor.py
      - name: Lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Some tests read the pinned original sources, so fetch them first.
      - name: Fetch locked original sources
        run: cargo xtask bootstrap
      - name: Rust regression and differential tests
        run: cargo test --locked --workspace
      - name: Browser protocol and visual build checks
        run: cargo check --locked --target wasm32-unknown-unknown -p rs09-protocol -p rs09-client -p rs09-audio-worklet
      - name: Reproduce original JVM outputs and source hashes
        run: cargo xtask oracle --check
      - name: Reproduce original cache reader and extraction fixtures
        run: cargo xtask cache-oracle --check
      - name: Reproduce original network and lobby fixtures
        run: cargo xtask network-oracle --check
      - name: Fetch and verify complete pinned cache
        if: github.event_name == 'workflow_dispatch'
        run: cargo xtask cache-fetch
      - name: Compare all cache files with original JVM
        if: github.event_name == 'workflow_dispatch'
        run: cargo run --release -p xtask -- cache-audit --jvm
      - name: Connect original JVM cache client to Rust server
        if: github.event_name == 'workflow_dispatch'
        run: cargo xtask network-interop
      - name: Build native headless cache probe
        if: github.event_name == 'workflow_dispatch'
        run: cargo build --locked -p rs09-headless
      - name: Exercise 500 TCP and 500 WebSocket cache connections
        if: github.event_name == 'workflow_dispatch'
        run: cargo xtask network-smoke
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce original RT4 game connection liveness boundaries
        run: cargo xtask headless-lifecycle-oracle --check
      - name: Install original Kotlin compiler's JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Reproduce original Java and Kotlin login cases
        run: cargo xtask login-oracle --check
      - name: Verify original and Rust login codecs over real sockets
        run: cargo xtask login-interop
      - name: Reproduce original account and password rules
        run: cargo xtask auth-oracle --check
      - name: Reproduce complete original configuration parser and settings
        run: cargo xtask config-oracle --check
      - name: Reproduce original player metadata and communication data behavior
        run: cargo xtask player-oracle --check
      - name: Reproduce original character saved records and numeric strings
        run: cargo xtask saved-data-oracle --check
      - name: Reproduce original attribute store, JSON save/load and legacy XML files
        run: cargo xtask attributes-oracle --check
      - name: Reproduce complete original Ironman mode, manager and callback behavior
        run: cargo xtask ironman-oracle --check
      - name: Reproduce complete original bank container, listener and item ownership
        run: cargo xtask bank-oracle --check
      - name: Reproduce original bank interface, callback registries and interface packet bodies
        run: cargo xtask bank-interface-oracle --check
      - name: Reproduce original input parser, prompt cleanup and bank transfer callback
        run: cargo xtask input-prompt-oracle --check
      - name: Original plain dialogue and Continue behavior
        run: cargo xtask plain-dialogue-oracle --check
      - name: Original modern interaction listeners and scheduling
        run: cargo xtask interaction-listeners-oracle --check
      - name: Reproduce original player variables, definitions, loader and packets
        run: cargo xtask variables-oracle --check
      - name: Reproduce original bank PIN manager, status and interface handler
        run: cargo xtask bank-pin-oracle --check
      - name: Reproduce original skill rules, callbacks and profile sections
        run: cargo xtask skills-oracle --check
      - name: Reproduce original item definitions, templates and JDK case comparison
        run: |
          cargo xtask item-oracle --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/port_jdk_case.py --check
      - name: Reproduce original item instances, containers, events and callbacks
        run: cargo xtask inventory-oracle --check
      - name: Reproduce shared container receivers and exposed listener references
        run: cargo xtask container-ownership-oracle --check
      - name: Reproduce distinct native listener objects, aliases and callback rebinding
        run: cargo xtask container-listeners-oracle --check
      - name: Reproduce canonical distinct-player listener fields and wire recipients
        run: cargo xtask owned-player-oracle --check
      - name: Reproduce original equipment container, listener and bonus methods
        run: cargo xtask equipment-oracle --check
      - name: Reproduce full player appearance, shared defaults and retained receivers
        run: cargo xtask player-appearance-oracle --check
      - name: Reproduce late appearance receivers, shared output and failed byte prefixes
        run: cargo xtask appearance-writer-oracle --check
      - name: Reproduce original inventory listener, container packet bytes and pouch keys
        run: |
          cargo xtask inventory-listener-oracle --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/port_summoning_pouch_ids.py --check
      - name: Reproduce joined player inventory, weight and packet effects
        run: cargo xtask player-inventory-oracle --check
      - name: Reproduce complete original item configuration loader and typed values
        run: |
          cargo xtask item-config-oracle --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/port_item_config.py --check
      - name: Reproduce original timer manager, persistence and core player profiles
        run: cargo xtask core-profile-oracle --check
      - name: Reproduce original timer registry, factories and automatic installation
        run: cargo xtask timer-registry-oracle --check
      - name: Reproduce original pulses, entity manager and world queue
        run: cargo xtask pulses-oracle --check
      - name: Reproduce original script processor, movement phases and script APIs
        run: cargo xtask scripts-oracle --check
      - name: Reproduce revision-530 actions, state fields and outgoing game packets
        run: cargo xtask game-packets-oracle --check
      - name: Reproduce original ground item lists, packet updates and pile selection
        run: cargo xtask ground-items-oracle --check
      - name: Reproduce original door rules, configuration and autowalk pulse bodies
        run: cargo xtask doors-oracle --check
      - name: Reproduce original scenery replacement, restoration and object updates
        run: cargo xtask scenery-oracle --check
      - name: Reproduce original server chunk collision flags and mutation order
        run: cargo xtask clipping-oracle --check
      - name: Reproduce original chunk scenery storage, copies and rebasing
        run: cargo xtask chunk-oracle --check
      - name: Reproduce original landscape decoding, storage and collision application
        run: cargo xtask landscape-oracle --check
      - name: Reproduce original terrain parsing and floor clipping over native chunks
        run: cargo xtask mapscape-oracle --check
      - name: Reproduce original scenery constructors, morph families and geometry
        run: cargo xtask scenery-node-oracle --check
      - name: Reproduce original Region.load ordering and failure prefixes
        run: cargo xtask region-load-oracle --check
      - name: Reproduce joined region, door, collision, packets and restoration
        run: cargo xtask scene-oracle --check
      - name: Reproduce original player renderer and normal scene rebuild
        run: cargo xtask player-render-oracle --check
      - name: Reproduce original appearance fields and naked-body preparation
        run: cargo xtask appearance-oracle --check
      - name: Reproduce original walking queue, energy, teleports and zone vetoes
        run: cargo xtask walking-oracle --check
      - name: Reproduce original pathfinding, heap ties and interaction reach
        run: |
          cargo xtask pathfinding-oracle --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/port_reach.py --check
      - name: Reproduce original movement pulses and destination geometry
        run: cargo xtask movement-oracle --check
      - name: Reproduce original node destination and collision supplier dispatch
        run: cargo xtask path-dispatch-oracle --check
      - name: Reproduce joined movement pulses, smart routes and walking queues
        run: cargo xtask navigation-oracle --check
      - name: Reproduce original walk requests and arrival pulses
        run: cargo xtask walk-request-oracle --check
      - name: Reproduce original scenery click dispatch and retained interactions
        run: cargo xtask scenery-action-oracle --check
      - name: Reproduce original interaction dispatch and captured arrival bodies
        run: cargo xtask legacy-interaction-oracle --check
      - name: Reproduce original option tables, defaults and retained aliases
        run: cargo xtask interaction-options-oracle --check
      - name: Reproduce ground click lookup and ordered interaction dispatch
        run: cargo xtask ground-action-oracle --check
      - name: Reproduce canonical ground targets joined to original walking
        run: cargo xtask ground-target-oracle --check
      - name: Reproduce native item option registration and definition precedence
        run: cargo xtask item-option-registry-oracle --check
      - name: Reproduce landscape, clipping, water and teleport predicates
        run: cargo xtask region-queries-oracle --check
      - name: Reproduce ground defaults joined to native item option lookup
        run: cargo xtask ground-options-oracle --check
      - name: Reproduce scenery defaults joined to native scenery option lookup
        run: cargo xtask scenery-options-oracle --check
      - name: Reproduce original major and entity tick phase order
        run: cargo xtask tick-oracle --check
      - name: Reproduce joined player walk requests, scheduling and movement
        run: cargo xtask player-walk-oracle --check
      - name: Reproduce joined legacy arrivals and canonical plain/movement scheduling
        run: cargo xtask interaction-runtime-oracle --check
      - name: Reproduce shared entity/scenery pulse ordering and restoration
        run: cargo xtask world-pulses-oracle --check
      - name: Reproduce original map viewport traversal and retained chunk identities
        run: cargo xtask map-chunk-render-oracle --check
      - name: Reproduce original chunk rebuilds, item visibility and dirty reset
        run: cargo xtask chunk-sync-oracle --check
      - name: Reproduce original viewport chunk clearing and packet boundaries
        run: cargo xtask clear-chunk-oracle --check
      - name: Reproduce original ground-item management and owner packet delivery
        run: cargo xtask ground-manager-oracle --check
      - name: Reproduce original ground-spawn subtype and respawn scheduler
        run: cargo xtask ground-spawn-oracle --check
      - name: Reproduce complete ground-spawn loader and pinned world spawn data
        run: cargo xtask ground-spawn-loader-oracle --check
      - name: Reproduce original pickup restrictions and ordered item transfer
        run: cargo xtask pickup-oracle --check
      - name: Reproduce packet queues, entity lifecycle and joined update sequence
        run: cargo xtask world-update-oracle --check
      - name: Reproduce original NPC renderer
        run: cargo xtask npc-render-oracle --check
      - name: Reproduce original NPC definitions and configuration
        run: |
          cargo xtask npc-definition-oracle --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/port_npc_schema.py --check
      - name: Compare complete pinned server NPC metadata with original JVM
        if: github.event_name == 'workflow_dispatch'
        run: cargo run --release -p xtask -- npc-definition-audit
      - name: Reproduce original NPC tick and wandering
        run: cargo xtask npc-tick-oracle --check
      - name: Reproduce original NPC factory and initialization
        run: cargo xtask npc-init-oracle --check
      - name: Reproduce entity chunk membership and ordered local queries
        run: cargo xtask entity-regions-oracle --check
      - name: Reproduce original interface metadata and gameframe orchestration
        run: cargo xtask interfaces-oracle --check
      - name: Reproduce original player settings and captured service ordering
        run: cargo xtask settings-oracle --check
      - name: Reproduce original update-mask lifecycle and live encoder traversal
        run: cargo xtask update-masks-oracle --check
      - name: Reproduce joined entity facing and prepared player mask bytes
        run: cargo xtask prepared-masks-oracle --check
      - name: Reproduce complete server animation records, definitions and controller
        run: cargo xtask animator-oracle --check
      - name: Compare every pinned server animation definition with the original JVM
        if: github.event_name == 'workflow_dispatch'
        run: cargo run --release -p xtask -- animator-audit
      - name: Reproduce original full NPC spawn data and loader
        run: cargo xtask npc-spawns-oracle --check
      - name: Reproduce original NPC drop tables, shared tables and seeded rolls
        run: cargo xtask drop-tables-oracle --check
      - name: Reproduce original DUMB pathfinder
        run: cargo xtask dumb-path-oracle --check
      - name: Check authored DUMB traversal
        run: python tools/port_dumb.py --check
      - name: Verify walk/run/rebuild packets reach the shared player consumer
        run: cargo test -p rs09-server --example movement_session
      - name: Verify controlled NPC/player stream composition
        run: cargo test -p rs09-server --example npc_session
      - name: Compare real pinned Lumbridge door scene with original JVM
        if: github.event_name == 'workflow_dispatch'
        run: cargo run --release -p xtask -- scene-audit
      - name: Reproduce original server scenery definitions, aliases and child queries
        run: |
          cargo xtask scenery-definition-oracle --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/port_scenery_schema.py --check
      - name: Compare all pinned server scenery definitions with original JVM
        if: github.event_name == 'workflow_dispatch'
        run: cargo run --release -p xtask -- scenery-definition-audit
      - name: Reproduce JDK ROOT casing and authored Unicode/word data
        run: |
          cargo xtask string-case-oracle --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/port_jdk_lower.py --check
      - name: Compare all pinned item definitions with original JVM methods
        if: github.event_name == 'workflow_dispatch'
        run: cargo run --release -p xtask -- item-audit
      - name: Compare complete pinned item configuration over native cache definitions
        if: github.event_name == 'workflow_dispatch'
        run: cargo run --release -p xtask -- item-config-audit
      - name: Verify default-cost password hashes in both runtimes
        run: cargo xtask auth-interop
      - name: Verify SQL provider against original on isolated MariaDB, plaintext and TLS
        run: |
          openssl version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo xtask sql-oracle --check
